[project]
name = "jcode-catalog"
version = "0.1.0"
description = "Development CLI for the jcode patch catalog"
requires-python = ">=3.14,<3.15"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
jcode-catalog = "jcode_catalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcode_catalog"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
testpaths = ["src/jcode_catalog", "../scripts", "../../customizations/plugins", "../../customizations/workers/tests"]

[tool.uv]
package = true
