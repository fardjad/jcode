[project]
name = "jcode-harness-client"
version = "0.1.0"
description = "Synchronous Python client for the versioned jcode harness API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["jcode_harness_client"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["jcode_harness_client"]

[tool.ruff.lint.per-file-ignores]
"smoke/mock_completions.py" = ["E402"]
