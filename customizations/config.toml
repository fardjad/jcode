[compaction]
# Compaction starts at 80% of this budget, or 200k tokens for large models.
max_context_tokens = 250000
mode = "reactive"

[display]
compact_notifications = true
pin_images = false
resume_project_scope = true
session_picker_sort = "created"
show_agentgrep_output = true
show_bash_output = true
tool_call_details = true

[features]
auto_poke = false
memory = false
swarm = true

[hooks]
pre_tool_transform = ["python3 ~/.jcode/plugins/rtk/rtk-transform"]

[launch_hotkeys]
enabled = false
imported = true

[tools]
disabled = [
    "swarm",
    "maintainer_feedback",
]
mcp_tools = "deferred"
