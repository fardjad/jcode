[compaction]
max_context_tokens = 0
mode = "proactive"

[display]
compact_notifications = true
pin_images = false
resume_project_scope = true
session_picker_sort = "created"
show_agentgrep_output = true
show_bash_output = true
tool_call_details = true

[features]
auto_poke = false
memory = false
swarm = true

[hooks]
post_tool_transform = ["env JCODE_DELEGATION_GUARD_WORKER_BLUEPRINTS=advanced,expert python3 /home/far/.jcode/plugins/delegation-guard/delegation-guard-transform"]
post_tool_transform_timeout_ms = 500
pre_tool_transform = ["python3 ~/.jcode/plugins/rtk/rtk-transform"]

[launch_hotkeys]
enabled = false
imported = true

[tools]
disabled = [
    "swarm",
    "maintainer_feedback",
]
mcp_tools = "deferred"
