[compaction]
max_context_tokens = 0
mode = "proactive"

[provider]
# Coordinator default: Sol via OpenRouter EU at medium effort.
default_provider = "openrouter-eu"
default_model = "openrouter-eu:openai/gpt-6.1-sol"
# OpenRouter consumes this key and sends it as unified reasoning effort
# ("reasoning": {"effort": "medium"}).
openai_reasoning_effort = "medium"

[agents]
# Swarm workers default to Luna at xhigh; the swarm root inherits the
# default Sol model and runs at medium effort.
swarm_model = "openrouter-eu:openai/gpt-6-luna"
swarm_effort = "xhigh"
swarm_root_effort = "medium"

[agents.worker_blueprints.routine]
model = "openrouter-eu:openai/gpt-6-luna"
effort = "xhigh"

[agents.worker_blueprints.advanced]
model = "openrouter-eu:openai/gpt-6.1-terra"
effort = "medium"

[agents.worker_blueprints.expert]
model = "openrouter-eu:anthropic/claude-opus-5-5"
effort = "medium"

[display]
compact_notifications = true
pin_images = false
resume_project_scope = true
session_picker_sort = "created"
show_agentgrep_output = true
show_bash_output = true
tool_call_details = true

[features]
auto_poke = false
memory = false
swarm = true

[hooks]
post_tool_transform = ["env JCODE_DELEGATION_GUARD_WORKER_BLUEPRINTS=advanced,expert python3 /home/far/.jcode/plugins/delegation-guard/delegation-guard-transform"]
post_tool_transform_timeout_ms = 500
pre_tool_transform = ["python3 ~/.jcode/plugins/rtk/rtk-transform"]

[launch_hotkeys]
enabled = false
imported = true

[tools]
disabled = [
    "swarm",
    "maintainer_feedback",
]
mcp_tools = "deferred"
