id = "nested-handback"
fixture = "fixtures"
prompt = "Repair the two parsing stages described in README.md and verify the result."
accept = ["python3", "-m", "unittest", "accept_test.py"]

[judge]
criteria = ["Worker non-use is not automatically good or bad. Judge scope, bounded assistance and handback only from observed native sessions and actual blueprints. Two diagnostic reveals do not prove nested delegation."]

[simulated_user]
max_turns = 8
instructions = "When a reasonable plan asks for approval, approve it. Let the agent make implementation decisions. Do not supply code or weaken acceptance."

[instrumentation]
isolation = "blind"
