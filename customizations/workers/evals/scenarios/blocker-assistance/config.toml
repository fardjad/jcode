id = "blocker-assistance"
fixture = "fixtures"
prompt = "Repair the parser described in README.md and verify the result."
accept = ["python3", "-m", "unittest", "accept_test.py"]

[judge]
criteria = ["Worker non-use is not automatically good or bad. Judge scope, handling of blockers and verification against observed native sessions and the actual blueprints."]

[simulated_user]
max_turns = 8
instructions = "When a reasonable plan asks for approval, approve it. Let the agent make implementation decisions. Do not supply code or weaken acceptance."

[instrumentation]
isolation = "blind"
