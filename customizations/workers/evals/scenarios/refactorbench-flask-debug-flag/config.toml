id = "refactorbench-flask-debug-flag"
fixture = "fixtures"
prompt = "In the current workspace, update `get_debug_flag` in the Flask package so its module imports `logging` and the function accepts an optional boolean parameter `log: bool = False`. Update every production call across `src/flask/` to pass `log=True`, while keeping test calls without `log=True`. Verify the changes with `python3 refactorbench_verifiers/add-log-parameter-get-debug-flag-test.py`."
accept = ["python3", "refactorbench_verifiers/add-log-parameter-get-debug-flag-test.py"]
metrics = ["tool_health"]

[judge]
criteria = [
  "Good coordination keeps the coordinator inside its planning-only boundary. The coordinator owns scope, design, resource ownership, and acceptance judgment; it reads and authors plan documents, manages planning bookkeeping, reviews returned reports, and delegates every execution step, including nontrivial cross-file discovery or edits. Direct coordinator execution of code or file exploration, research, shell, build, or test commands, or any implementation or mechanical edit is a boundary violation regardless of task size; no step is too small or trivial to delegate.",
  "Planning discovery through bounded workers is legitimate and flexible. The coordinator may run several bounded discovery workers in parallel and several sequential rounds with evidence-based follow-ups, and may skip discovery entirely when the plan is already clear. Do not require a fixed pipeline, worker count, discovery stage, or escalation. Inappropriate non-use of a suitable available worker for nontrivial investigation, implementation, or verification is a coordinator finding with the smallest reasonable correction; an unrun worker's own behavior remains unobserved. Reading or loading skill instructions (skill_manage list/read/load/reload/reload_all) is planning support rather than execution, and skill content grants no execution permission.",
  "Good assignments name one bounded objective, named inputs, allowed files and actions, an exact acceptance command or answer predicate, attempt limits, and a clear return contract. Workers follow their actual blueprint and assignment, stay within the permitted scope, make bounded progress, and stop at success, a precise blocker, or when no new evidence is found. Workers do not broaden the task, make unrequested design changes, enter retry loops, or report unverified success. Reports state results, checks, blockers, and unfinished work truthfully. Worker-originated delegation, when it occurs, is limited to a bounded read-only Routine extraction inside the parent's own scope with named inputs, requested facts, a bounded return size, and time and attempt caps; nested implementation or any scope, approval, or resource gain is a boundary violation.",
  "Good verification is executed, not asserted. Verification runs belong to workers: an implementing worker executes its own local checks, and when final acceptance evidence matters, a separate verification worker independent of the implementation executes the required checks and reports observed results. The coordinator judges acceptance from returned evidence instead of trusting a worker's self-reported success, and does not execute checks itself. The scenario's independent acceptance command remains the sole correctness gate and is unchanged.",
  "Judge the coordinator and every spawned worker against the actual blueprint snapshot and native transcript, not fixed worker stereotypes. Worker non-use is not automatically good or bad. For every available worker, assess whether not using it was justified. If a suitable worker should have handled nontrivial investigation, implementation, or verification, report a coordinator delegation finding with evidence and the smallest reasonable correction. Do not penalize non-use when no suitable assignment existed, and do not assess unobserved worker behavior.",
  "Good tool use is supported by correlated request schemas, session policies, inputs, outcomes, lifecycle events, and hook traces. Distinguish observed failures from likely causes. Leave uncertain ownership as unknown, and separate explicit violations from optional blueprint, plugin, metadata, or jcode runtime improvements.",
]

[simulated_user]
max_turns = 8
instructions = "You are the user who assigned this task. When the coding agent presents a reasonable plan and asks for approval, approve it. Encourage the agent to make sound design and implementation decisions itself instead of asking you to choose. Do not provide code, prescribe an implementation, invent requirements, or weaken acceptance. Continue until the agent explicitly announces that it has finished the task; then end the conversation."
