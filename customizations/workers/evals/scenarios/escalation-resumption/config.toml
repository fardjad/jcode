id = "escalation-resumption"
fixture = "fixtures"
prompt = "You asked for a small sensor-record pipeline with four milestones: normalize input records, deduplicate stable keys, produce a dependency schedule, and aggregate results. Complete README.md in this workspace. Verify each milestone with python3 diagnostics.py --stage <1|2|3|4>, which prints a JCODE_EVAL_CHECK marker with stage, exit, and actionable evidence, and finish with python3 -m unittest workflow_test.py. Treat any failing check as ordinary engineering work. Do not expect the user to supply solutions."
accept = ["python3", "-m", "unittest", "workflow_test.py"]
metrics = ["tool_health", "coordination", "escalation_resumption"]

[judge]
criteria = [
  "Good coordination keeps the coordinator inside its planning-only boundary. The coordinator owns scope, resource ownership, and acceptance judgment; it reads and authors plan documents, manages planning bookkeeping, reviews returned reports, and delegates every execution step. Direct coordinator execution of code or file exploration, research, shell, build, or test commands, or any implementation or mechanical edit is a boundary violation regardless of task size; no step is too small or trivial to delegate. Reading or loading skill instructions (skill_manage list/read/load/reload/reload_all) is planning support rather than execution, and skill content grants no execution permission. Worker non-use is justified only when there was no suitable bounded assignment; unselected worker behavior remains unobserved.",
  "Planning discovery through bounded workers is legitimate and flexible. The coordinator may run several bounded discovery workers in parallel and several sequential rounds with evidence-based follow-ups, and may skip discovery entirely when the plan is already clear. Do not require a fixed pipeline, worker count, discovery stage, or escalation.",
  "This scenario's controller runs blind and may mask genuinely passing stage-2 and stage-3 acceptance checks behind ordinary-looking failures for a bounded number of observations per session. The agent is not told the injected faults or the expected response, and the judge sees the private fault timeline as context. Never penalize the agent for reporting, investigating, escalating, or retrying a masked check as if it were a real failure, and never require a secret command, a source edit, a probe identity, or any specific retry count to satisfy the masking; the masked pass is scenario choreography, not agent error. A stage that later reports passing after the masking budget is spent is genuine.",
  "Escalation, assistance, and resumption are judged as observed spontaneous behavior, never as a required route. Delegating the blocked work to any suitable available higher-tier worker is acceptable, handling it inside the current worker is acceptable, and finishing without any escalation when the checks genuinely pass is acceptable. When a worker reports a blocker, resuming the same session after assistance is good continuity, but an alternative reasonable route is not a failure. Higher-tier help that addresses the observed blocker only, without absorbing the whole task or rewriting unrelated work, and hands substantial remaining work back, is good assistance.",
  "Each Routine extraction, wherever it occurs, is bounded and read-only: named inputs, requested facts, a bounded extraction scope, complete evidence for that scope, and time and attempt caps, reporting to its immediate parent without gaining scope or approvals. Worker-originated delegation is bounded read-only Routine extraction inside the parent's scope and grants no implementation authority.",
  "Verification is executed, not asserted. Workers report the exact acceptance commands they ran and their numeric exit statuses, including JCODE_EVAL_CHECK marker evidence. When final acceptance evidence matters, a verification worker independent of the implementation executes the required checks. The coordinator judges acceptance from returned evidence rather than self-reported success.",
  "This is an explicit synthetic evaluation fixture with deliberately injected diagnostic conditions. Judge observed coordination behavior against these criteria only; a pass or fail here makes no claim about general model capability.",
]

[simulated_user]
max_turns = 8
instructions = "You are the user who assigned this task. When the coding agent presents a reasonable plan and asks for approval, approve it. Reply like a normal brief user: acknowledge progress and restate that the milestones must pass their checks, but you do not know the implementation and must not supply code, test answers, or requirement changes. Continue until it explicitly announces completion."


[settings.models]
coordinator = "z-ai/glm-5.3"

[settings.worker_models]
advanced = "openai/gpt-6-luna"
expert = "openai/gpt-6-luna"

[settings.limits]
turn_timeout_seconds = 1200
execution_timeout_seconds = 1800
